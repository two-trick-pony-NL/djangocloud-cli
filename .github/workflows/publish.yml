# Publishes to PyPI when a GitHub Release is published. Uses PyPI "trusted publishing" (OIDC), so no
# API token is stored anywhere. One-time setup: on pypi.org add a trusted publisher for this repository,
# workflow "publish.yml", environment "pypi".
name: publish
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read  # a job-level permissions block drops the defaults; checkout of a private repo needs this
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version is read from git tags
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Built version must match the release tag
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's#.*/[^-]+-([^-]+)-.*#\1#')
          if [ "$built" != "$expected" ]; then
            echo "::error::Built version $built does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
