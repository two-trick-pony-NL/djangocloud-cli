[project]
name = "djangocloud-cli"
dynamic = ["version"]  # from the git tag (hatch-vcs): tag v0.2.0 -> version 0.2.0
description = "Deploy a Django app from the command line: djangocloud login, djangocloud deploy, djangocloud logs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13", "questionary>=2.0"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter van Doorn", email = "peter@petervandoorn.com" }]
keywords = ["django", "deploy", "cli", "aws", "lightsail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://djangocloud.dev"
Source = "https://github.com/two-trick-pony-NL/djangocloud-cli"
Issues = "https://github.com/two-trick-pony-NL/djangocloud-cli/issues"

[project.scripts]
djangocloud = "djangocloud_cli.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/djangocloud_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/djangocloud_cli"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "django>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
