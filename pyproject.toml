[project]
name = "djangocloud-cli"
version = "0.0.1"
description = "Deploy a Django app from the command line: djangocloud login, djangocloud deploy, djangocloud logs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13", "questionary>=2.0"]
classifiers = ["Framework :: Django", "Programming Language :: Python :: 3"]

[project.scripts]
djangocloud = "djangocloud_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djangocloud_cli"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "django>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
