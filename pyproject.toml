[project]
name = "djangocloud-cli"
version = "0.0.1"
description = "Deploy a Django app from the command line: cloud login, cloud deploy, cloud logs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only, so it can't conflict with the host project's packages
classifiers = ["Framework :: Django", "Programming Language :: Python :: 3"]

[project.scripts]
cloud = "djangocloud_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djangocloud_cli"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
